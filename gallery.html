<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLD ROCKER CAVID — Foto Albom</title>
    <link rel="stylesheet" href="style.css">

    <style>
        /* GALLERY LAYOUT */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 30px;
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* PHOTO FRAMES */
        .gallery-placeholder {
            min-height: 420px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-sizing: border-box;
        }

        /* THIRD PHOTO CENTERED UNDERNEATH */
        .gallery-placeholder:nth-child(3) {
            grid-column: 1 / 3;
            justify-self: center;
            width: 70%;
            min-height: 420px;
        }

        /* MOBILE LAYOUT */
        @media (max-width: 650px) {
            .gallery-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .gallery-placeholder {
                min-height: 320px;
            }

            .gallery-placeholder:nth-child(3) {
                grid-column: auto;
                width: 100%;
                min-height: 320px;
            }
        }
    </style>
</head>
