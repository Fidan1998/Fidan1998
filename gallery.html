    <style>
        /* FOTO ALBOMU — yalnız bu səhifəyə aiddir */
        body.gallery-page .content .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            align-items: start;
            gap: 30px;
            width: 100%;
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 15px;
            box-sizing: border-box;
        }

        /* ÇƏRÇİVƏ — fotonun ölçüsünə uyğunlaşır */
        body.gallery-page .content .gallery-placeholder {
            display: block;
            width: fit-content;
            max-width: 100%;
            height: auto;
            min-height: 0;
            max-height: none;
            padding: 12px;
            margin: 0 auto;
            box-sizing: border-box;
            overflow: visible;
        }

        /* FOTO — orijinal nisbətini qoruyur */
        body.gallery-page .content .gallery-placeholder img {
            display: block;
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 500px;
            object-fit: contain;
            object-position: center;
            margin: 0 auto;
        }

        /* ÜÇÜNCÜ FOTO — aşağıda, ortada */
        body.gallery-page .content .gallery-placeholder:nth-child(3) {
            grid-column: 1 / 3;
            justify-self: center;
        }

        /* TELEFONLAR ÜÇÜN */
        @media (max-width: 650px) {
            body.gallery-page .content .gallery-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            body.gallery-page .content .gallery-placeholder {
                max-width: 100%;
            }

            body.gallery-page .content .gallery-placeholder:nth-child(3) {
                grid-column: 1;
            }
        }
    </style>
</head>
