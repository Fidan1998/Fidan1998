    <link rel="stylesheet" href="style.css">

    <style>
        /* FOTO ALBOMU */
        body.inside-page .content .gallery-grid {
            display: grid !important;
            grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
            gap: 30px !important;
            width: 100% !important;
            max-width: 1100px !important;
            margin: 40px auto !important;
            padding: 0 15px !important;
            box-sizing: border-box !important;
        }

        /* HƏR BİR FOTO ÇƏRÇİVƏSİ */
        body.inside-page .content .gallery-grid .gallery-placeholder {
            width: 100% !important;
            height: 420px !important;
            min-height: 0 !important;
            max-height: 420px !important;
            padding: 12px !important;
            margin: 0 !important;
            box-sizing: border-box !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            overflow: hidden !important;
        }

        /* FOTOLARIN ÖLÇÜSÜ */
        body.inside-page .content .gallery-grid .gallery-placeholder img {
            display: block !important;
            width: 100% !important;
            height: 100% !important;
            max-width: 100% !important;
            max-height: 100% !important;
            min-width: 0 !important;
            min-height: 0 !important;
            object-fit: contain !important;
            object-position: center !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        /* ÜÇÜNCÜ FOTO AŞAĞIDA, ORTADA */
        body.inside-page .content .gallery-grid .gallery-placeholder:nth-child(3) {
            grid-column: 1 / 3 !important;
            justify-self: center !important;
            width: 70% !important;
        }

        /* TELEFONLAR ÜÇÜN */
        @media (max-width: 650px) {
            body.inside-page .content .gallery-grid {
                grid-template-columns: 1fr !important;
                gap: 20px !important;
            }

            body.inside-page .content .gallery-grid .gallery-placeholder {
                height: 320px !important;
                max-height: 320px !important;
            }

            body.inside-page .content .gallery-grid .gallery-placeholder:nth-child(3) {
                grid-column: 1 !important;
                width: 100% !important;
            }
        }
    </style>
</head>
